<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Soundstage Visualizer Lab</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #020205; }
      #viz { width: 100%; height: 100%; display: block; }
      #wave { display: none; }
      .panel {
        position: fixed; z-index: 4; top: 16px; left: 16px; width: min(980px, calc(100vw - 32px));
        max-height: calc(100vh - 32px); overflow: auto;
        display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px;
        border: 1px solid rgba(255,255,255,.13); border-radius: 16px;
        color: rgba(255,255,255,.9); background: rgba(5,6,10,.62); backdrop-filter: blur(18px);
        box-shadow: 0 18px 80px rgba(0,0,0,.38); transition: opacity .25s ease;
      }
      .panel.is-dim { opacity: .12; }
      .brand { padding: 0 6px; margin-right: 4px; font-size: 12px; font-weight: 750; letter-spacing: .11em; text-transform: uppercase; }
      button, select, input, audio {
        height: 34px; border: 1px solid rgba(255,255,255,.13); border-radius: 10px;
        color: #fff; background: rgba(255,255,255,.075); font: inherit; font-size: 12px;
      }
      button, select { padding: 0 11px; cursor: pointer; }
      button:hover, select:hover { background: rgba(255,255,255,.13); }
      button[aria-pressed="true"] { color: #baff83; border-color: rgba(156,255,91,.52); }
      label { display: flex; align-items: center; gap: 6px; color: rgba(255,255,255,.55); font-size: 11px; }
      input { width: 92px; padding: 0 9px; }
      input[type="range"] { padding: 0; accent-color: #a9ff74; }
      audio { width: 250px; height: 34px; }
      .knobs { flex-basis: 100%; display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px 14px; padding: 9px 5px 2px; border-top: 1px solid rgba(255,255,255,.08); }
      .knob { display: grid; grid-template-columns: 1fr auto; gap: 3px 8px; }
      .knob[data-for]:not([data-for="all"]) { display: none; }
      body[data-mode="bloom"] .knob[data-for="bloom"],
      body[data-mode="ridge"] .knob[data-for="ridge"],
      body[data-mode="magnetosphere"] .knob[data-for="magnetosphere"],
      body[data-mode="pulse"] .knob[data-for="pulse"] { display: grid; }
      [hidden] { display: none !important; }
      .knob input { grid-column: 1 / -1; width: 100%; height: 20px; }
      .knob output { color: rgba(255,255,255,.82); font: 10px ui-monospace, SFMono-Regular, Menlo, monospace; }
      .track { max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: rgba(255,255,255,.62); font-size: 11px; }
      .drop-active::after { content: "Drop audio to play"; position: fixed; inset: 20px; z-index: 20; display: grid; place-items: center; border: 2px dashed rgba(170,255,112,.7); border-radius: 24px; background: rgba(2,3,6,.78); color: #caffaa; font-size: 22px; pointer-events: none; }
      .status { margin-left: auto; padding: 0 5px; color: rgba(255,255,255,.46); font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; }
      .hint { position: fixed; right: 16px; bottom: 16px; z-index: 3; color: rgba(255,255,255,.3); font-size: 11px; }
    </style>
  </head>
  <body>
    <canvas id="viz"></canvas>
    <canvas id="wave"></canvas>
    <div class="panel" id="panel">
      <span class="brand">Soundstage Lab</span>
      <label>Visualizer
        <select id="mode">
          <option value="magnetosphere" selected>Magnetosphere</option>
          <option value="pulse">Pulse</option>
          <option value="ridge">Ridge</option>
          <option value="bloom">Bloom</option>
          <option value="dance">Dance</option>
        </select>
      </label>
      <label data-mode-only="magnetosphere">Scene
        <select id="preset">
          <option value="-1">Auto</option>
          <option value="0" selected>Classic bouquet</option>
          <option value="1">Gravity garden</option>
          <option value="2">Wire spikes</option>
          <option value="3">Ribbon storm</option>
        </select>
      </label>
      <label>Audio
        <select id="audio">
          <option value="hero">Hero mix</option>
          <option value="ambient">Ambient</option>
          <option value="transient">Transient</option>
          <option value="silence">Silence</option>
          <option value="local">Local song</option>
        </select>
      </label>
      <button id="load-song">Load song</button>
      <input id="song-file" type="file" accept="audio/*,.mp3" hidden>
      <audio id="player" controls hidden></audio>
      <span class="track" id="track-name">Drop an MP3 here</span>
      <button id="freeze" data-mode-only="magnetosphere" aria-pressed="false">Freeze</button>
      <button id="lock" data-mode-only="magnetosphere" aria-pressed="false">Lock camera</button>
      <label data-mode-only="magnetosphere">Seed <input id="seed" value="1831565813" inputmode="numeric"></label>
      <button id="reset" data-mode-only="magnetosphere">Reset</button>
      <button id="shot">Screenshot</button>
      <span class="status" id="status">starting…</span>
      <div class="knobs" id="knobs">
        <label class="knob" data-for="all"><span>Sensitivity</span><output></output><input data-param="sensitivity" type="range" min="0" max="2.2" step="0.05" value="1"></label>
        <label class="knob" data-for="all"><span>Loud glow</span><output></output><input data-param="loudGlow" type="range" min="0" max="2" step="0.05" value="0.85"></label>
        <label class="knob" data-for="pulse"><span>Cover art</span><output></output><input data-param="pulseArt" type="checkbox" checked></label>
        <label class="knob" data-for="bloom"><span>Bright</span><output></output><input data-param="bloomBright" type="range" min="0.58" max="0.85" step="0.01" value="0.72"></label>
        <label class="knob" data-for="bloom"><span>Size</span><output></output><input data-param="bloomSize" type="range" min="0.4" max="2.2" step="0.05" value="1"></label>
        <label class="knob" data-for="bloom"><span>Spread</span><output></output><input data-param="bloomSpread" type="range" min="0" max="1.6" step="0.05" value="0.55"></label>
        <label class="knob" data-for="bloom"><span>Spin</span><output></output><input data-param="bloomSpin" type="range" min="0" max="2.5" step="0.05" value="1"></label>
        <label class="knob" data-for="bloom"><span>Outer spin</span><output></output><input data-param="bloomSwirl" type="range" min="0" max="5" step="0.05" value="1.5"></label>
        <label class="knob" data-for="bloom"><span>Shape</span><output></output><input data-param="bloomShape" type="range" min="0" max="1" step="0.01" value="0.28"></label>
        <label class="knob" data-for="bloom"><span>Hue</span><output></output><input data-param="bloomHue" type="range" min="0" max="1" step="0.01" value="0.72"></label>
        <label class="knob" data-for="bloom"><span>Warm</span><output></output><input data-param="bloomWarm" type="range" min="0" max="1" step="0.01" value="0.42"></label>
        <label class="knob" data-for="bloom"><span>Spark</span><output></output><input data-param="bloomSpark" type="range" min="0" max="1" step="0.01" value="0.48"></label>
        <label class="knob" data-for="bloom"><span>Soft</span><output></output><input data-param="bloomSoft" type="range" min="0" max="1" step="0.01" value="0.55"></label>
        <label class="knob" data-for="bloom"><span>Tight</span><output></output><input data-param="bloomTight" type="range" min="0" max="1" step="0.01" value="0"></label>
        <label class="knob" data-for="ridge"><span>Zoom</span><output></output><input data-param="ridgeZoom" type="range" min="2.2" max="3.5" step="0.05" value="2.4"></label>
        <label class="knob" data-for="ridge"><span>Height</span><output></output><input data-param="ridgeHeight" type="range" min="0.7" max="4.5" step="0.05" value="1.15"></label>
        <label class="knob" data-for="ridge"><span>Freq</span><output></output><input data-param="ridgeFreq" type="range" min="0.2" max="1" step="0.01" value="1"></label>
        <label class="knob" data-for="ridge"><span>Fuzz</span><output></output><input data-param="ridgeFuzz" type="range" min="0" max="1" step="0.01" value="0.28"></label>
        <label class="knob" data-for="magnetosphere"><span>Reflect</span><output></output><input data-param="magReflect" type="range" min="0" max="1" step="0.01" value="0.52"></label>
        <label class="knob" data-for="magnetosphere"><span>Void halo</span><output></output><input data-param="magVoidGlow" type="range" min="0" max="1" step="0.01" value="0.12"></label>
        <label class="knob" data-for="magnetosphere"><span>Density</span><output></output><input data-param="magDensity" type="range" min="0.1" max="1" step="0.01" value="0.88"></label>
        <label class="knob" data-for="magnetosphere"><span>Density flow</span><output></output><input data-param="magDensityAuto" type="range" min="0" max="1" step="0.01" value="0.58"></label>
        <label class="knob" data-for="magnetosphere"><span>Trails</span><output></output><input data-param="magTrail" type="range" min="0.2" max="2.5" step="0.05" value="1"></label>
        <label class="knob" data-for="magnetosphere"><span>Ribbons</span><output></output><input data-param="magRibbon" type="range" min="0" max="2.5" step="0.05" value="1"></label>
        <label class="knob" data-for="magnetosphere"><span>Atmosphere</span><output></output><input data-param="magAtmosphere" type="range" min="0" max="2" step="0.05" value="1"></label>
        <label class="knob" data-for="magnetosphere"><span>Bloom</span><output></output><input data-param="magBloom" type="range" min="0.2" max="1.1" step="0.05" value="1"></label>
        <label class="knob" data-for="magnetosphere"><span>Motion</span><output></output><input data-param="magMotion" type="range" min="0.25" max="2" step="0.05" value="1"></label>
        <label class="knob" data-for="magnetosphere"><span>Core size</span><output></output><input data-param="magCoreSize" type="range" min="0.6" max="1.6" step="0.05" value="1"></label>
      </div>
    </div>
    <div class="hint">Drop an MP3 · H hides controls · deterministic seed + real Web Audio analysis</div>
    <script src="src/vendor/three.min.js"></script>
    <script src="src/vendor/three-addons.js"></script>
    <script src="src/magnetosphere-post.js"></script>
    <script src="src/audio-engine.js"></script>
    <script src="src/audio-hud.js"></script>
    <script src="src/motion.js"></script>
    <script src="src/visualizer.js"></script>
    <script>
      const query = new URLSearchParams(location.search);
      const seed = Number(query.get("seed") || 1831565813) >>> 0;
      const preset = Number(query.get("preset") ?? 0);
      const canvas = document.querySelector("#viz");
      const waveCanvas = document.querySelector("#wave");
      const viz = new SCVizVisualizer(canvas, waveCanvas, {
        magSeed: seed,
        magPreset: preset,
      });
      viz.setMode(query.get("mode") || "magnetosphere");
      viz.setAccent([116, 255, 92]);
      viz.resize();
      viz.start();

      const freq = new Uint8Array(256);
      const wave = new Uint8Array(512);
      const audioSelect = document.querySelector("#audio");
      const modeSelect = document.querySelector("#mode");
      const presetSelect = document.querySelector("#preset");
      const status = document.querySelector("#status");
      const seedInput = document.querySelector("#seed");
      const songInput = document.querySelector("#song-file");
      const player = document.querySelector("#player");
      const trackName = document.querySelector("#track-name");
      const syncModeUi = () => {
        const activeMode = viz.setMode(modeSelect.value);
        document.body.dataset.mode = activeMode;
        document.querySelectorAll("[data-mode-only]").forEach((element) => {
          element.hidden = element.dataset.modeOnly !== activeMode;
        });
      };
      if (query.get("mode")) {
        const wanted = query.get("mode");
        if ([...modeSelect.options].some((option) => option.value === wanted)) {
          modeSelect.value = wanted;
        }
      }
      syncModeUi();
      if (query.get("hide") === "1") {
        document.querySelector("#panel")?.setAttribute("hidden", "");
        document.querySelector(".hint")?.setAttribute("hidden", "");
      }
      seedInput.value = String(seed);
      presetSelect.value = String(preset);
      let frames = 0;
      let fpsAt = performance.now();
      let audioContext = null;
      let engine = null;
      let mediaSource = null;
      const hud = new ScvizAudioHud().mount();
      viz.onRender = () => hud.tickRender();
      let songUrl = "";

      const readLabParams = () => {
        try {
          return JSON.parse(localStorage.getItem("soundstage-mag-lab-params") || "{}");
        } catch {
          return {};
        }
      };
      const writeLabParams = (params) => {
        try {
          localStorage.setItem("soundstage-mag-lab-params", JSON.stringify(params));
        } catch {}
      };
      const savedParams = readLabParams();
      const savedReflectFlow = Number(savedParams.magReflectAuto);
      if (Number.isFinite(savedReflectFlow)) {
        const savedReflect = Number(savedParams.magReflect);
        savedParams.magReflect = Math.min(
          1,
          Math.max(0, (Number.isFinite(savedReflect) ? savedReflect : 0) + savedReflectFlow)
        );
        delete savedParams.magReflectAuto;
        writeLabParams(savedParams);
      }
      document.querySelectorAll("#knobs input[data-param]").forEach((input) => {
        const key = input.dataset.param;
        const output = input.parentElement.querySelector("output");
        const isCheck = input.type === "checkbox";
        if (Number.isFinite(Number(savedParams[key]))) {
          if (isCheck) input.checked = Number(savedParams[key]) >= 0.5;
          else input.value = String(savedParams[key]);
        }
        const apply = () => {
          const value = isCheck ? (input.checked ? 1 : 0) : Number(input.value);
          output.value = isCheck
            ? value ? "On" : "Off"
            : value.toFixed(2).replace(/0+$/, "").replace(/\.$/, "");
          viz.setParams({ [key]: value });
          writeLabParams({ ...readLabParams(), [key]: value });
        };
        input.addEventListener(isCheck ? "change" : "input", apply);
        apply();
      });

      const ensureAudioGraph = async () => {
        if (!audioContext) {
          audioContext = new AudioContext();
          hud.ctxAudio = audioContext;
        }
        if (!engine) {
          mediaSource = audioContext.createMediaElementSource(player);
          mediaSource.connect(audioContext.destination);
          engine = new ScvizAudio.AudioEngine(audioContext, mediaSource, {
            workletUrl: new URL("src/audio-worklet.js", location.href).href,
            onFrame: (frame) => {
              viz.setFrame(frame);
              hud.push(frame);
            },
            onStatus: (status) => hud.setStatus(status),
          });
          window.__scvizEngine = engine; // poke from devtools
          await engine.start();
          setInterval(() => hud.setStatus(engine.status()), 700);
        }
        await audioContext.resume();
      };

      const loadSong = async (file) => {
        if (!file) return;
        await ensureAudioGraph();
        if (songUrl) URL.revokeObjectURL(songUrl);
        songUrl = URL.createObjectURL(file);
        player.src = songUrl;
        player.hidden = false;
        trackName.textContent = file.name;
        trackName.title = file.name;
        audioSelect.value = "local";
        await player.play().catch(() => {});
      };

      const chooseSong = async () => {
        if (window.showOpenFilePicker) {
          try {
            const [handle] = await showOpenFilePicker({
              startIn: "downloads",
              multiple: false,
              types: [{ description: "Audio", accept: { "audio/*": [".mp3", ".m4a", ".wav", ".ogg"] } }],
            });
            await loadSong(await handle.getFile());
            return;
          } catch (error) {
            if (error?.name === "AbortError") return;
          }
        }
        songInput.click();
      };

      document.querySelector("#load-song").addEventListener("click", chooseSong);
      songInput.addEventListener("change", () => loadSong(songInput.files[0]));
      addEventListener("dragover", (event) => {
        event.preventDefault();
        document.body.classList.add("drop-active");
      });
      addEventListener("dragleave", (event) => {
        if (!event.relatedTarget) document.body.classList.remove("drop-active");
      });
      addEventListener("drop", (event) => {
        event.preventDefault();
        document.body.classList.remove("drop-active");
        loadSong([...event.dataTransfer.files].find((file) => file.type.startsWith("audio/") || /\.mp3$/i.test(file.name)));
      });

      player.addEventListener("timeupdate", () => {
        viz.setProgress(player.duration ? player.currentTime / player.duration : 0);
      });

      const feedSynthetic = (t, kind) => {
        for (let i = 0; i < freq.length; i++) {
          const falloff = Math.exp(-i / 82);
          const beat = Math.pow(Math.max(0, Math.sin(t * 2.35) - 0.5), 3) * Math.exp(-i / 34);
          const air = Math.max(0, Math.sin(t * 7.1 + i * 0.19)) * Math.exp(-Math.abs(i - 150) / 75);
          let value = 0;
          if (kind === "hero") value = 14 + falloff * (68 + 38 * Math.sin(t * 0.9 + i * 0.13)) + beat * 520 + air * 34;
          if (kind === "ambient") value = 12 + falloff * (42 + 26 * Math.sin(t * 0.32 + i * 0.08));
          if (kind === "transient") value = 8 + falloff * 32 + beat * 690 + air * 72;
          freq[i] = Math.max(0, Math.min(255, value));
        }
        for (let i = 0; i < wave.length; i++) wave[i] = 128 + 78 * Math.sin(i * 0.09 + t * 5.5);
      };

      const feed = () => {
        const kind = audioSelect.value;
        // Local playback is driven by the engine on its own fixed clock; only
        // the synthetic generators still push raw bytes at render rate.
        if (kind !== "local") {
          feedSynthetic(performance.now() * 0.001, kind);
          viz.setAudio(freq, wave);
        }
        frames++;
        if (performance.now() - fpsAt > 500) {
          const fps = Math.round(frames * 1000 / (performance.now() - fpsAt));
          const info = viz.renderer.info.render;
          const size = viz.renderer.getDrawingBufferSize(viz._statusSize ||= new THREE.Vector2());
          status.textContent = `${fps} fps · ${viz.frameMsSmooth.toFixed(1)} ms · q ${Math.round(viz.magQualityScale * 100)}% · ${size.x}×${size.y} · ${info.calls} calls · power ${viz.loudness.toFixed(2)}`;
          frames = 0;
          fpsAt = performance.now();
        }
        requestAnimationFrame(feed);
      };
      feed();

      modeSelect.addEventListener("change", syncModeUi);
      audioSelect.addEventListener("change", () => {
        if (audioSelect.value === "local") {
          if (!player.getAttribute("src")) chooseSong();
          else player.play().catch(() => {});
        } else {
          player.pause();
        }
      });
      presetSelect.addEventListener("change", () => {
        viz.setMagnetosphereOptions({ preset: Number(presetSelect.value) });
      });
      const toggle = (id, key) => {
        const button = document.querySelector(id);
        button.addEventListener("click", () => {
          const on = button.getAttribute("aria-pressed") !== "true";
          button.setAttribute("aria-pressed", String(on));
          viz.setMagnetosphereOptions({ [key]: on });
        });
      };
      toggle("#freeze", "freeze");
      toggle("#lock", "cameraLock");
      document.querySelector("#reset").addEventListener("click", () => {
        const next = new URL(location.href);
        next.searchParams.set("seed", String(Number(seedInput.value) >>> 0));
        next.searchParams.set("preset", presetSelect.value);
        location.href = next;
      });
      document.querySelector("#shot").addEventListener("click", () => {
        viz._tick(0);
        const link = document.createElement("a");
        link.download = `soundstage-${viz.mode}-${Date.now()}.png`;
        link.href = canvas.toDataURL("image/png");
        link.click();
      });
      addEventListener("keydown", (event) => {
        const key = event.key.toLowerCase();
        if (key === "h") document.querySelector("#panel").classList.toggle("is-dim");
        if (key === "d") hud.toggle();
      });
      addEventListener("resize", () => viz.resize());
    </script>
  </body>
</html>
